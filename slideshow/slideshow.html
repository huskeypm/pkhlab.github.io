<!DOCTYPE html>
<html>

<head>
<meta http-equiv="refresh" content="600">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* Base styles from your source  */
  * {box-sizing: border-box;}
  body {font-family: Verdana, sans-serif; margin: 0;}
  .mySlides {display: none;}
  img {vertical-align: middle; width: 100%;}

  .slideshow-container {
    max-width: 1000px;
    position: relative;
    margin: auto;
  }

/* Caption text */
  .text {
    color: #f2f2f2;
    font-size: 15px;
    padding: 8px 12px;
    position: absolute;
    bottom: 8px;
    width: 100%;
    text-align: center;
    background-color: rgba(0,0,0,0.3); /* Added for readability */
  }

/* Number text (1/3 etc) */
  .numbertext {
    color: #f2f2f2;
    font-size: 12px;
    padding: 8px 12px;
    position: absolute;
    top: 0;
  }

/* The dots/bullets/indicators */
.dot {
  height: 15px;
  width: 15px;
  margin: 0 2px;
  background-color: #bbb;
  border-radius: 50%;
  display: inline-block;
  transition: background-color 0.6s ease;
}

.active {
  background-color: #717171;
}
    
/*   Next & previous buttons */
  .prev, .next {
    cursor: pointer;
    position: absolute;
    top: 50%;
    width: auto;
    margin-top: -22px;
    padding: 16px;
    color: white;
    font-weight: bold;
    font-size: 18px;
    transition: 0.6s ease;
    border-radius: 0 3px 3px 0;
    user-select: none;
  }
/* On hover, add a black background color with a little bit see-through */
  .next { right: 0; border-radius: 3px 0 0 3px; }
  .prev:hover, .next:hover { background-color: rgba(0,0,0,0.8); }


/* Fading animation */
  .fade {
    animation-name: fade;
    animation-duration: 1.5s;
  }


  @keyframes fade {
    from {opacity: .4}
    to {opacity: 1}
  }

/* On smaller screens, decrease text size - not sure if still using 
@media only screen and (max-width: 300px) {
  .text {font-size: 11px}
}
*/

</style>
</head>
<body>

<div class="slideshow-container">
  <div class="mySlides fade">
    <div class="numbertext">1 / 11</div>
    <img src="IMG_1.jpg">
    <div class="text"></div>
  </div>

  <div class="mySlides fade">
    <div class="numbertext">2 / 11</div>
    <img src="cal.png">
    <div class="text">Weekly calendar</div>
  </div>

  <div class="mySlides fade">
    <div class="numbertext">3 / 11</div>
    <img src="IMG_2.jpg">
    <div class="text"></div>
  </div>

  <div class="mySlides fade">
    <div class="numbertext">4 / 11</div>
    <img src="weather.png">
    <div class="text">Weather</div>
  </div>

  <div class="mySlides fade">
    <div class="numbertext">5 / 11</div>
    <img src="IMG_3.jpg">
    <div class="text"></div>
  </div>

  <div class="mySlides fade">
    <div class="numbertext">6 / 11</div>
    <img src="accounts.png">
    <div class="text">Kids' accounts</div>
  </div>

  <div class="mySlides fade">
    <div class="numbertext">7 / 11</div>
    <img src="IMG_4.jpg">
    <div class="text"></div>
  </div>

  <div class="mySlides fade">
    <div class="numbertext">8 / 11</div>
    <img src="pkhcalendar.png">
    <div class="text">PKH calendar</div>
  </div>

  <div class="mySlides fade">
    <div class="numbertext">9 / 11</div>
    <img src="IMG_5.png">
    <div class="text"></div>
  </div>

  <div class="mySlides fade">
    <div class="numbertext">10 / 11</div>
    <img src="todos.png">
    <div class="text"></div>
  </div>

  <div class="mySlides fade">
    <div class="numbertext">11 / 11</div>
    <img src="daily.png">
    <div class="text"></div>
  </div>

  <a class="prev" onclick="plusSlides(-1)">❮</a>
  <a class="next" onclick="plusSlides(1)">❯</a>
</div>

<br>

<!-- one for each image PKH? -->
<div style="text-align:center">
  <span class="dot"></span><!-- 1 -->
  <span class="dot"></span><span class="dot"></span>
  <span class="dot"></span><span class="dot"></span><span class="dot"></span>
  <span class="dot"></span><span class="dot"></span><span class="dot"></span>
  <span class="dot"></span><span class="dot"></span>
</div>


<script>
let slideIndex = 0;
let timer;

// Start the show 
showSlides();

function plusSlides(n) {
  clearTimeout(timer); // Reset timer if user clicks manually
  slideIndex += n;
  showSlidesManually(); // This now calls the function that also handles cache busting
}

function showSlides() {
  let slides = document.getElementsByClassName("mySlides"); 
  let dots = document.getElementsByClassName("dot");

  for (let i = 0; i < slides.length; i++) {
    slides[i].style.display = "none"; 
  }

  // Logic for randomization 
  let rand = Math.floor(Math.random() * slides.length);
  
  // SYNC FIX: Ensure global index matches the random selection
  slideIndex = rand;
   
  // CACHE BUSTER: Force the browser to fetch the image again 
  let img = slides[rand].getElementsByTagName('img')[0];
  if (img) {
      let baseSrc = img.src.split('?')[0];
      img.src = baseSrc + "?t=" + new Date().getTime();
  }

  slides[rand].style.display = "block"; 

  for (let i = 0; i < dots.length; i++) {
    dots[i].className = dots[i].className.replace(" active", ""); 
  }
  dots[rand].className += " active"; 

  timer = setTimeout(showSlides, 5000); 
}

// Helper for manual navigation
function showSlidesManually() {
  let slides = document.getElementsByClassName("mySlides");
  let dots = document.getElementsByClassName("dot");

  if (slideIndex >= slides.length) {slideIndex = 0}
  if (slideIndex < 0) {slideIndex = slides.length - 1}

  for (let i = 0; i < slides.length; i++) {
    slides[i].style.display = "none";
  }
  
  // MANUAL FIX: Add Cache Buster here too, so manual clicks also show fresh images
  let img = slides[slideIndex].getElementsByTagName('img')[0];
  if (img) {
      let baseSrc = img.src.split('?')[0];
      img.src = baseSrc + "?t=" + new Date().getTime();
  }
  
  slides[slideIndex].style.display = "block";
  
  for (let i = 0; i < dots.length; i++) {
    dots[i].className = dots[i].className.replace(" active", "");
  }
  dots[slideIndex].className += " active";
  
  // Go back to auto-random mode after 5 seconds
  timer = setTimeout(showSlides, 5000);
}
</script>

</body>
</html>
