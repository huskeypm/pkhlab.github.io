<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * {box-sizing: border-box;}
  body {font-family: Verdana, sans-serif; margin: 0; background-color: #000; color: white; overflow: hidden;}
  
  .slideshow-container {
    width: 100vw;
    height: 100vh;
    position: relative;
    margin: auto;
    background-color: #000;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .mySlides { display: none; width: 100%; height: 100%; text-align: center; }
  
  img {
    width: 100%;
    height: 100%;
    /* This ensures the image fills the width and height of the screen */
    object-fit: cover; 
  }

  /* Fullscreen Button */
  .fs-btn {
    position: absolute;
    top: 10px;
    right: 10px;
    z-index: 100;
    background: rgba(255, 255, 255, 0.2);
    color: white;
    border: none;
    padding: 10px 15px;
    cursor: pointer;
    border-radius: 5px;
    font-size: 12px;
  }
  .fs-btn:hover { background: rgba(255, 255, 255, 0.4); }

  /* Navigation Arrows */
  .prev, .next {
    cursor: pointer;
    position: absolute;
    top: 50%;
    width: auto;
    margin-top: -30px;
    padding: 20px;
    color: white;
    font-weight: bold;
    font-size: 40px; /* Increased size for brackets */
    transition: 0.3s ease;
    user-select: none;
    background-color: rgba(0,0,0,0.2);
    z-index: 10;
    text-decoration: none;
    font-family: monospace;
  }

  .next { right: 0; border-radius: 3px 0 0 3px; }
  .prev { left: 0; border-radius: 0 3px 3px 0; }
  .prev:hover, .next:hover { background-color: rgba(0,0,0,0.7); }

  .text {
    color: #f2f2f2;
    font-size: 20px;
    padding: 15px;
    position: absolute;
    bottom: 40px;
    width: 100%;
    text-align: center;
    background-color: rgba(0,0,0,0.5);
  }

  .numbertext {
    color: #f2f2f2;
    font-size: 14px;
    padding: 12px;
    position: absolute;
    top: 0;
    left: 0;
    background-color: rgba(0,0,0,0.4);
  }

  .dot-container {
    position: absolute;
    bottom: 10px;
    width: 100%;
    text-align: center;
    z-index: 15;
  }

  .dot {
    height: 10px;
    width: 10px;
    margin: 0 3px;
    background-color: #555;
    border-radius: 50%;
    display: inline-block;
    transition: background-color 0.6s ease;
  }

  .active { background-color: #fff; }

  .fade {
    animation-name: fade;
    animation-duration: 1s;
  }

  @keyframes fade {
    from {opacity: .3}
    to {opacity: 1}
  }
</style>
</head>
<body id="main-body">

<button class="fs-btn" onclick="toggleFullScreen()">⛶ Fullscreen</button>

<div class="slideshow-container" id="slides-target">
  <a class="prev" onclick="event.preventDefault(); plusSlides(-1)">[</a>
  <a class="next" onclick="event.preventDefault(); plusSlides(1)">]</a>
  
  <div class="dot-container" id="dots-target"></div>
</div>

<script>
const imageList = [
  { src: "IMG_1.jpg", caption: "" },
  { src: "cal.png",   caption: "Weekly calendar" },
  { src: "IMG_2.jpg", caption: "" },
  { src: "weather.png", caption: "Weather" },
  { src: "IMG_3.jpg", caption: "" },
  { src: "accounts.png", caption: "Kids' accounts" },
  { src: "IMG_4.jpg", caption: "" },
  { src: "pkhcalendar.png", caption: "PKH calendar" },
  { src: "IMG_5.png", caption: "" },
  { src: "todos.png", caption: "" },
  { src: "daily.png", caption: "" }
];

/* rotate every 30000 */
const DISPLAY_TIME = 30000; 
let slideIndex = 0;
let timer;

function initSlideshow() {
  const container = document.getElementById('slides-target');
  const dotsTarget = document.getElementById('dots-target');
  
  imageList.forEach((imgObj, index) => {
    const slideDiv = document.createElement('div');
    slideDiv.className = "mySlides fade";
    slideDiv.innerHTML = `
      <div class="numbertext">${index + 1} / ${imageList.length}</div>
      <img src="${imgObj.src}" onerror="this.parentElement.innerHTML='<div style=padding:100px>Image Load Error: ${imgObj.src}</div>';">
      ${imgObj.caption ? `<div class="text">${imgObj.caption}</div>` : ''}
    `;
    container.appendChild(slideDiv);

    const dotSpan = document.createElement('span');
    dotSpan.className = "dot";
    dotsTarget.appendChild(dotSpan);
  });

  showSlides(); 
}

function plusSlides(n) {
  clearTimeout(timer);
  slideIndex += n;
  if (slideIndex >= imageList.length) { slideIndex = 0; }
  if (slideIndex < 0) { slideIndex = imageList.length - 1; }
  renderSlide(slideIndex);
}

function showSlides() {
  let rand = Math.floor(Math.random() * imageList.length);
  slideIndex = rand;
  renderSlide(slideIndex);
}

function renderSlide(index) {
  let slides = document.getElementsByClassName("mySlides");
  let dots = document.getElementsByClassName("dot");

  for (let i = 0; i < slides.length; i++) {
    slides[i].style.display = "none";
    dots[i].className = dots[i].className.replace(" active", "");
  }

  let img = slides[index].querySelector('img');
  if (img && img.tagName === 'IMG') {
    let baseSrc = img.src.split('?')[0];
    img.src = baseSrc + "?t=" + new Date().getTime();
  }

  slides[index].style.display = "block";
  dots[index].className += " active";
  timer = setTimeout(showSlides, DISPLAY_TIME);
}

function toggleFullScreen() {
  let elem = document.documentElement;
  if (!document.fullscreenElement && !document.webkitFullscreenElement && !document.msFullscreenElement) {
      if (elem.requestFullscreen) {
          elem.requestFullscreen();
      } else if (elem.webkitRequestFullscreen) { /* Safari */
          elem.webkitRequestFullscreen();
      } else if (elem.msRequestFullscreen) { /* IE11 */
          elem.msRequestFullscreen();
      }
  } else {
    if (document.exitFullscreen) {
      document.exitFullscreen();
    } else if (document.webkitExitFullscreen) { /* Safari */
      document.webkitExitFullscreen();
    } else if (document.msExitFullscreen) { /* IE11 */
      document.msExitFullscreen();
    }
  }
}

initSlideshow();
</script>

</body>
</html>
